# environment
# Pass the active environment from CLI, e.g.:
# python multi-modal_train.py -env walker/walk
envs:
  walker/stand:
    action_shape: 6
    num_env_steps: 300100
  walker/walk:
    action_shape: 6
    num_env_steps: 500100
  cartpole/swingup:
    action_shape: 1
    num_env_steps: 300100
  cartpole/swingup_sparse:
    action_shape: 1
    num_env_steps: 300100
  cartpole/balance:
    action_shape: 1
    num_env_steps: 300100
  ball_in_cup/catch:
    action_shape: 2
    num_env_steps: 300100
  finger/spin:
    action_shape: 2
    num_env_steps: 500100
  walker/run:
    action_shape: 6
    num_env_steps: 500100
  cheetah/run:
    action_shape: 6
    num_env_steps: 500100


pre_transform_image_size: 84
image_size: 84
action_repeat: 4
frame_stack: 3
# replay buffer
replay_buffer_capacity: 50000
# train
agent: mjpr # 'curl_sac' or 'spr_sac' or 'cycdm_sac' or 'mjpr'
init_steps: 1000
batch_size: 64
hidden_dim: 1024
# eval  
eval_freq: 5000
num_eval_episodes: 5
# critic
critic_lr: 1e-3
critic_beta: 0.9
critic_tau: 0.01
critic_target_update_freq: 2
# actor
actor_lr: 1e-3
actor_beta: 0.9
actor_log_std_min: -10
actor_log_std_max: 2
actor_update_freq: 2
# encoder
encoder_type: pixel
encoder_feature_dim: 50
encoder_lr: 1e-3
encoder_tau: 0.05
num_layers: 4
num_filters: 32
# sac
discount: 0.99
init_temperature: 0.1
alpha_lr: 1e-4
alpha_beta: 0.5
# cycdm

# SPR predicts H targets at offsets k * spr_action_skip from one anchor.
spr_horizon: 5
spr_action_skip: 1
transition_model_type: 'deterministic'
transition_model_layer_width: 512
auxiliary_task_batch_size: 64
time_offset: 0
momentum_tau: 0.01
aug_prob: 1.0
num_aug_actions: 10
loss_space: y
bp_mode: gt # 'detach' or 'esti' or 'hybrid' or 'gt'
cycle_steps: 6
cycle_mode: fp+cycle # 'fp'(SPR) or 'fp+cycle'(PlayVirtual) or 'fp+bp+cycle'
bp_loss_weight: 1.0
rc_loss_weight: 0.0
vc_loss_weight: 1.0
reward_loss_weight: 0.0
auxiliary_task_lr: 1e-3
# misc
seed: 0
gpuid: 0
seed_and_gpuid: [1234, 0] # this item will be ignored when given seed and gpuid
# seed_and_gpuid: [1111, 0] # this item will be ignored when given seed and gpuid
# seed_and_gpuid: [2222, 0] # this item will be ignored when given seed and gpuid
# seed_and_gpuid: [8888, 0] # this item will be ignored when given seed and gpuid

work_dir: ./cycdm_runs
save_tb: True
save_buffer: False
save_video: False
save_model: True
detach_encoder: False
# log
log_interval: 1000
# wandb
wandb: False
